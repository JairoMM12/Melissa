<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower de Melissa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page:#f1d9cc; --shadow:rgba(122,59,18,.25);
  --cream:#fdebdd; --ink:#7a3b12; --red:#b3141f; --red-ink:#fff8ee; --gold:#b8863b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark; --page:#2a1210; --shadow:rgba(0,0,0,.55); }
}
:root[data-theme="dark"]{ color-scheme: dark; --page:#2a1210; --shadow:rgba(0,0,0,.55); }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--page)}
body{
  margin:0; min-height:100vh; background:var(--page); color:var(--ink);
  font-family:'Lora',Georgia,'Times New Roman',serif;
  display:flex; justify-content:center; padding:20px 14px 36px;
}
.card{
  width:100%; max-width:460px; background:var(--cream);
  border:2px solid var(--gold); border-radius:26px; overflow:hidden;
  box-shadow:0 16px 38px var(--shadow);
}
.invite{
  display:block; width:100%; height:auto;
  -webkit-mask-image:linear-gradient(to bottom,#000 91%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 91%,transparent 100%);
}
nav{display:flex; flex-direction:column; gap:12px; padding:0 22px 26px; margin-top:-14px; position:relative}
.btn{
  display:flex; align-items:center; justify-content:center; gap:12px;
  min-height:56px; padding:13px 20px; border-radius:999px;
  font:600 1.08rem/1.2 'Lora',Georgia,serif; text-decoration:none; text-align:center;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn svg{width:23px; height:23px; flex:none}
.btn:active{transform:translateY(2px) scale(.99)}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.solid{background:var(--red); color:var(--red-ink); box-shadow:0 5px 14px rgba(179,20,31,.28)}
.line{background:transparent; color:var(--ink); border:2px solid var(--gold)}
.line svg{color:var(--red)}
.divider{display:flex; align-items:center; gap:12px; color:var(--red); margin:6px 0 2px}
.divider::before,.divider::after{content:""; flex:1; height:1.5px; background:linear-gradient(to right,transparent,var(--gold))}
.divider::after{background:linear-gradient(to left,transparent,var(--gold))}
.divider svg{width:20px; height:20px}
#snow{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10}
@media (prefers-reduced-motion: reduce){.btn{transition:none} #snow{display:none}}
</style>
</head>

    for (var i = 0; i < 6; i++){
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0);
      ctx.moveTo(L * 0.55, 0); ctx.lineTo(L * 0.8, L * 0.28);
      ctx.moveTo(L * 0.55, 0); ctx.lineTo(L * 0.8, -L * 0.28);
      ctx.stroke();
    }
    ctx.restore();
  }
  function frame(t){
    ctx.clearRect(0, 0, w, h);
    ctx.shadowColor = 'rgba(150,80,60,.45)'; ctx.shadowBlur = 4;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff';
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.v; f.rot += f.vr;
      f.x += Math.sin(t / 1000 * f.sw + f.s) * 0.45;
      if (f.y > h + 14 || f.x < -20 || f.x > w + 20){ flakes[i] = make(false); flakes[i].x = Math.random() * w; continue; }
      ctx.globalAlpha = f.a;
      if (f.crystal) crystal(f);
      else { ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.8, 0, 6.2832); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  size();
  window.addEventListener('resize', size);
  requestAnimationFrame(frame);
})();
</script>
